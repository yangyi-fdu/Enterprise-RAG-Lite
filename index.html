<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RAG Lite</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f4f5f7; margin: 0; display: flex; justify-content: center; }
    main { width: 100%; max-width: 720px; margin: 40px 16px; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 1px 6px rgba(0,0,0,.08); }
    h1 { font-size: 1.2rem; margin: 0 0 12px; }
    #log { height: 420px; overflow-y: auto; border: 1px solid #ddd; border-radius: 6px; padding: 10px; background: #fafafa; }
    .msg { margin: 8px 0; white-space: pre-wrap; }
    .user { font-weight: 600; }
    .bot.fallback { color: #8a5a00; }
    details { font-size: .85rem; color: #555; margin: 2px 0 10px 12px; }
    form { display: flex; gap: 8px; margin-top: 12px; }
    input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 6px; }
    button { padding: 10px 18px; border: 0; border-radius: 6px; background: #1f6feb; color: #fff; cursor: pointer; }
  </style>
</head>
<body>
<main>
  <h1>RAG Lite: ask the Halden Robotics handbook</h1>
  <div id="log"></div>
  <form id="form">
    <input id="q" placeholder="e.g. How many days of annual leave do I get?" autocomplete="off">
    <button type="submit">Send</button>
  </form>
</main>
<script>
  const API = "http://127.0.0.1:8000";
  const sessionId = crypto.randomUUID();
  const log = document.getElementById("log");

  function add(cls, text) {
    const div = document.createElement("div");
    div.className = "msg " + cls;
    div.textContent = text;  // textContent, not innerHTML: model output is untrusted
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
    return div;
  }

  document.getElementById("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const input = document.getElementById("q");
    const question = input.value.trim();
    if (!question) return;
    input.value = "";
    add("user", "You: " + question);
    try {
      const res = await fetch(API + "/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question, session_id: sessionId }),
      });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      add("bot" + (data.fallback ? " fallback" : ""), "Assistant: " + data.answer);
      if (data.sources.length) {
        const d = document.createElement("details");
        const s = document.createElement("summary");
        s.textContent = data.sources.length + " source chunk(s)";
        d.appendChild(s);
        for (const src of data.sources) {
          const p = document.createElement("p");
          p.textContent = `#${src.chunk_id} (similarity ${src.score.toFixed(2)}): ${src.text}`;
          d.appendChild(p);
        }
        log.appendChild(d);
      }
    } catch (err) {
      add("bot fallback", "Error: could not reach the backend (" + err.message + "). Is uvicorn running?");
    }
  });
</script>
</body>
</html>
